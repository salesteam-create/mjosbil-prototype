<style>
/* Mjøsbil design system v0.1 tokens */
:root {
  --ink: #0d1820;
  --ink-2: #33414b;
  --muted: #66737c;
  --fjord: #0a2630;
  --mjos: #00a9c2;
  --mjos-ink: #00788a;
  --mjos-soft: #e3f6f9;
  --isbre: #8fdbe6;
  --sno: #f4f6f7;
  --line: #e2e6e9;
  --line-2: #eef1f3;
  --surface: #ffffff;
  --ok: #127a4a;
  --ok-soft: #e4f5ec;
  --warn: #b86e00;
  --warn-soft: #fff4e0;
  --err: #b42318;
  --err-soft: #fdecea;
  --plate: #0d3e9c;
  --r-chip: 6px;
  --r-input: 10px;
  --r-btn: 14px;
  --r-card: 20px;
  --r-panel: 28px;
  --d1: 0 1px 2px rgba(13, 24, 32, .04), 0 8px 24px rgba(13, 24, 32, .06);
  --d2: 0 12px 40px rgba(13, 24, 32, .18);
  --font: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --label: 'Plus Jakarta Sans', system-ui, sans-serif;
  --plate-font: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--sno); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
img, svg { display: block; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--mjos-ink); text-decoration: none; }
a:hover { color: var(--ink); }
h1, h2, h3 { margin: 0; letter-spacing: -0.03em; }
p { margin: 0; }
.muted { color: var(--muted); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.lbl { font-family: var(--label); }
.kicker { font-family: var(--label); font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--mjos-ink); display: inline-flex; align-items: center; gap: 6px; }
.on-dark .kicker, .kicker.light { color: var(--isbre); }
.num { font-family: var(--label); font-weight: 700; font-variant-numeric: tabular-nums; }
.ico { width: 20px; height: 20px; flex: none; }

/* Prototype ribbon */
.ribbon { background: var(--ink); color: #b9c6ce; font: 600 11px/1.4 var(--label); text-align: center; padding: 6px 16px; letter-spacing: .02em; }

/* ---------- Header ---------- */
.hdr { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, .94); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.hdr .wrap { display: flex; align-items: center; gap: 20px; height: 64px; }
.logo { display: block; flex: none; }
.logo img { height: 22px; width: auto; }
.nav { display: none; gap: 2px; }
.nav a { color: var(--ink-2); padding: 8px 12px; border-radius: 10px; font-size: 15px; font-weight: 500; }
.nav a:hover { background: var(--sno); color: var(--ink); }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.lang button { border: 0; background: none; font: 700 11px/1 var(--label); padding: 6px 10px; border-radius: 999px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 0; background: none; position: relative; color: var(--ink); }
.icon-btn:hover { background: var(--sno); }
.icon-btn .dot { position: absolute; top: 5px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--mjos); color: var(--ink); font: 800 10px/16px var(--label); text-align: center; padding: 0 4px; }
.icon-btn.me { width: auto; padding: 0 10px; gap: 6px; display: none; font-weight: 600; font-size: 14px; }
.hdr .hdr-book { display: none; }
.hdr-help { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--ink-2); font: 600 13px var(--label); }
.hdr-help .ico { width: 16px; height: 16px; color: var(--muted); }
.hdr-help span.t { display: none; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-btn); padding: 14px 20px; font-weight: 700; font-size: 16px; line-height: 1.2; transition: transform .08s ease, background .15s, box-shadow .15s, opacity .15s; white-space: nowrap; color: inherit; }
.btn:active { transform: scale(.98); }
.btn .ico { width: 18px; height: 18px; }
.btn-ink { background: var(--ink); color: #fff; }
.btn-ink:hover { background: #1d2e39; color: #fff; }
.btn-ink[disabled], .btn-mjos[disabled] { background: #b5bec4; color: #fff; cursor: not-allowed; }
.btn-mjos { background: var(--mjos); color: var(--ink); }
.btn-mjos:hover { background: #12b9d1; color: var(--ink); }
.btn-ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn-ghost:hover { box-shadow: inset 0 0 0 1px #c4ccd2; color: var(--ink); }
.btn-white { background: #fff; color: var(--ink); }
.btn-white:hover { color: var(--ink); }
.btn-vipps { background: #ff5b24; color: #fff; }
.btn-vipps:hover { background: #ec4d18; color: #fff; }
.btn-sm { padding: 10px 14px; font-size: 14px; border-radius: 12px; }
.btn-block { width: 100%; }
.link { background: none; border: 0; padding: 0; color: var(--mjos-ink); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { color: var(--ink); text-decoration: underline; }
.link .ico { width: 16px; height: 16px; }

/* ---------- Plate ---------- */
.plate { display: flex; align-items: stretch; background: #fff; border: 2px solid var(--ink); border-radius: var(--r-input); overflow: hidden; height: 64px; max-width: 340px; }
.plate-eu { width: 36px; background: var(--plate); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 8px; gap: 5px; font: 700 13px/1 var(--label); flex: none; }
.plate-eu i { width: 16px; height: 16px; border-radius: 50%; border: 2px dotted #ffd200; }
.plate input { border: 0; outline: 0; flex: 1; min-width: 0; padding: 0 16px; font: 700 34px/1 var(--plate-font); letter-spacing: .06em; text-transform: uppercase; background: transparent; }
.plate input::placeholder { color: #c3cbd0; }
.plate:focus-within { box-shadow: 0 0 0 4px rgba(0, 169, 194, .25); }
.on-dark .plate { border-color: #fff; }
.plate-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.plate-row .plate { flex: 1 1 220px; }
.plate-row .btn { height: 64px; flex: 0 0 auto; padding: 0 22px; }
.chip-plate { display: inline-flex; align-items: stretch; border: 1.5px solid var(--ink); border-radius: var(--r-chip); background: #fff; overflow: hidden; font: 700 15px/1 var(--plate-font); letter-spacing: .06em; color: var(--ink); white-space: nowrap; }
.chip-plate b { background: var(--plate); color: #fff; font: 700 8px/1 var(--label); padding: 0 3px 3px; display: flex; align-items: flex-end; }
.chip-plate span { padding: 4px 7px 3px; }
.chip-plate.lg { font-size: 18px; }
.chip-plate.lg span { padding: 5px 9px 4px; }
.try { font: 600 12px var(--label); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.try button { background: none; border: 0; padding: 0; }
.on-dark .try { color: #8a9aa4; }

/* ---------- Tags ---------- */
.tag { display: inline-flex; align-items: center; gap: 5px; font: 700 12px/1 var(--label); padding: 5px 9px; border-radius: 999px; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.tag .ico { width: 13px; height: 13px; }
.tag-ok { background: var(--ok-soft); color: var(--ok); }
.tag-warn { background: var(--warn-soft); color: var(--warn); }
.tag-mjos { background: var(--mjos-soft); color: var(--mjos-ink); }
.tag-err { background: var(--err-soft); color: var(--err); }
.tag-ink { background: var(--ink); color: #fff; }

/* ---------- Notes + toast ---------- */
.note { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--mjos-soft); color: #064e59; font-size: 14px; }
.note .ico { width: 18px; height: 18px; margin-top: 1px; }
.note.warn { background: var(--warn-soft); color: #6b4300; }
.note.ok { background: var(--ok-soft); color: #0b4f30; }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: var(--d2); z-index: 80; display: flex; gap: 8px; align-items: center; animation: pop .22s ease; white-space: nowrap; }
.toast .ico { width: 18px; height: 18px; color: var(--isbre); }
@keyframes pop { from { transform: translate(-50%, 8px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

/* ---------- Home ---------- */
.hero { background: radial-gradient(900px 500px at 90% 0%, rgba(0, 169, 194, .22), transparent 60%), var(--fjord); color: #fff; }
.hero .wrap { padding-top: 36px; padding-bottom: 40px; display: grid; gap: 28px; }
.hero h1 { font-size: clamp(40px, 9vw, 72px); line-height: .98; font-weight: 800; letter-spacing: -.04em; margin: 14px 0 16px; }
.hero .sub { color: #b9c6ce; font-size: 17px; max-width: 500px; margin-bottom: 24px; }
.hero-photo { position: relative; border-radius: var(--r-panel); overflow: hidden; min-height: 280px; background: #12303b center / cover no-repeat; }
.hero-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 38, 48, 0) 50%, rgba(10, 38, 48, .55)); }
.float-card { position: absolute; left: 16px; bottom: 16px; z-index: 2; background: #fff; color: var(--ink); border-radius: 16px; padding: 12px 16px 12px 12px; display: flex; gap: 12px; align-items: center; box-shadow: var(--d2); }
.float-card .tile { width: 40px; height: 40px; border-radius: 12px; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.float-card small { display: block; font: 600 12px var(--label); color: var(--muted); }
.float-card b { font-size: 16px; }
.usps { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 24px; color: #cfd9de; font-size: 14px; }
.usps span { display: inline-flex; align-items: center; gap: 8px; }
.usps .ico { width: 16px; height: 16px; color: var(--mjos); }

.section { padding: 56px 0 0; }
.section:last-of-type { padding-bottom: 56px; }
.sec-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.sec-h h2 { font-size: clamp(26px, 4.4vw, 34px); font-weight: 800; line-height: 1.1; }
.sec-h p { margin-top: 6px; color: var(--muted); }

.intents { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.intent { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px 16px; text-align: left; display: grid; gap: 24px; align-content: space-between; min-height: 140px; transition: box-shadow .15s, transform .15s, border-color .15s; }
.intent:hover { box-shadow: var(--d1); transform: translateY(-2px); border-color: #cfd6db; }
.tile-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--mjos-soft); color: var(--mjos-ink); display: grid; place-items: center; }
.intent b { font-size: 16px; display: block; font-weight: 700; }
.intent small { font-size: 13px; color: var(--muted); display: block; }

.promos { display: grid; gap: 12px; }
.promo { border-radius: var(--r-panel); padding: 28px; display: grid; gap: 14px; align-content: start; position: relative; overflow: hidden; min-height: 280px; }
.promo h3 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; line-height: 1.05; max-width: 440px; }
.promo p { max-width: 420px; font-size: 15px; }
.promo .btn { justify-self: start; margin-top: 6px; }
.promo-winter { background: var(--mjos-soft); }
.promo-winter p { color: var(--ink-2); }
.promo-ev { background: var(--ink); color: #fff; }
.promo-ev p { color: #b9c6ce; }
.promo-photo { border-radius: 18px; background: center / cover no-repeat; min-height: 180px; }
.promo.with-photo { grid-template-columns: 1fr; }

.eu-check { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 24px; display: grid; gap: 16px; }
.eu-check h3 { font-size: 24px; font-weight: 800; }
.eu-res { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px; background: var(--warn-soft); color: #6b4300; }
.eu-res.ok { background: var(--ok-soft); color: #0b4f30; }
.eu-res .btn { margin-left: auto; }

.mycar-teaser { background: var(--fjord); color: #fff; border-radius: var(--r-panel); padding: 28px; display: grid; gap: 24px; overflow: hidden; }
.mycar-teaser h3 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; line-height: 1.05; }
.mycar-teaser p { color: #b9c6ce; max-width: 440px; }
.mini-stack { display: grid; gap: 10px; }
.mini { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.mini .tile-ico { background: rgba(0, 169, 194, .16); color: var(--isbre); }
.mini small { display: block; font: 600 12px var(--label); color: #8fa3ad; }
.mini b { font-size: 15px; }

.products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; display: grid; grid-template-rows: auto 1fr; color: var(--ink); transition: box-shadow .15s, transform .15s; }
.pcard:hover { box-shadow: var(--d1); transform: translateY(-2px); color: var(--ink); }
.pimg { aspect-ratio: 1 / 1; display: grid; place-items: center; background: #fff center / contain no-repeat; border-bottom: 1px solid var(--line-2); }
.pimg.cover { background-size: cover; }
.pbody { padding: 12px 14px 16px; display: grid; gap: 2px; align-content: start; }
.pbody .brand { font: 800 11px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pbody .name { font-weight: 700; font-size: 15px; line-height: 1.25; }
.pbody .spec { font-size: 13px; color: var(--muted); }
.pbody .price { margin-top: 8px; font: 700 16px var(--label); }
.pbody .price small { font-weight: 600; color: var(--muted); font-size: 12px; }
.pbody .tag { margin-top: 8px; justify-self: start; }

.locs { display: grid; gap: 10px; }
.loc-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; gap: 12px; align-items: center; }
.loc-card .meta { font: 600 12px var(--label); color: var(--muted); }
.loc-card .meta b { color: var(--ok); }
.loc-card .btn { margin-left: auto; }
.loc-photo { border-radius: var(--r-panel); min-height: 220px; background: center / cover no-repeat; }

.footer { background: var(--ink); color: #b9c6ce; padding: 40px 0 120px; margin-top: 56px; font-size: 14px; }
.footer .wrap { display: grid; gap: 18px; }
.footer img { height: 20px; width: auto; }
.footer .cols { display: grid; gap: 6px; }
.footer a { color: #fff; }

/* ---------- Booking ---------- */
.book { padding: 20px 0 140px; }
.book .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.book .main { min-width: 0; }
.stepper { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.stepper .s { display: grid; gap: 8px; font: 600 12px var(--label); color: var(--muted); }
.stepper .bar { height: 4px; border-radius: 2px; background: var(--line); }
.stepper .s.past .bar, .stepper .s.on .bar { background: var(--mjos); }
.stepper .s.on { color: var(--ink); font-weight: 800; }
.stepper .t { display: none; }
.back-btn { background: none; border: 0; padding: 14px 0 0; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 14px; font-weight: 500; }
.back-btn .ico { width: 16px; height: 16px; }
.back-btn:hover { color: var(--ink); }
.step-h { display: grid; gap: 6px; margin: 14px 0 20px; }
.step-h h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.05; font-weight: 800; }
.step-h p { color: var(--muted); }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.sub-h { font-weight: 700; font-size: 18px; margin-top: 10px; letter-spacing: -.02em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }

.car-card { padding: 14px 16px; display: flex; gap: 14px; align-items: center; }
.car-thumb { width: 52px; height: 52px; border-radius: 14px; background: var(--sno); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.car-thumb.ev { background: var(--mjos-soft); color: var(--mjos-ink); }
.car-card .t { flex: 1; min-width: 0; }
.car-card .t b { display: block; font-size: 17px; line-height: 1.25; }
.car-card .t small { display: block; font-size: 13px; color: var(--muted); }
.car-card .r { display: grid; gap: 6px; justify-items: end; }
.car-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.fact small { display: block; font: 600 12px var(--label); color: var(--muted); }
.fact b { font-size: 15px; }
.loading { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--mjos) 0 30%, var(--line) 30%); background-size: 200% 100%; animation: load 1s linear infinite; margin-top: 14px; max-width: 340px; }
@keyframes load { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.cats { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.chip:hover { border-color: #c4ccd2; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip .n { background: var(--mjos); color: var(--ink); border-radius: 999px; min-width: 18px; height: 18px; font: 800 11px/18px var(--label); text-align: center; padding: 0 5px; }

.opts { display: grid; gap: 10px; }
.opt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: grid; gap: 8px; text-align: left; width: 100%; transition: border-color .15s, box-shadow .15s; }
.opt:hover { border-color: #c4ccd2; }
.opt.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt-top { display: flex; gap: 12px; align-items: flex-start; }
.box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid #c4ccd2; flex: none; display: grid; place-items: center; color: #fff; margin-top: 1px; transition: background .15s, border-color .15s; }
.box .ico { width: 14px; height: 14px; stroke-width: 3; }
.on > .opt-top .box, .addon.on .box { background: var(--ink); border-color: var(--ink); }
.opt-title { font-weight: 700; flex: 1; font-size: 16px; line-height: 1.3; }
.opt-price { font: 700 15px var(--label); white-space: nowrap; text-align: right; }
.opt-price small { display: block; font-weight: 600; color: var(--muted); font-size: 11px; }
.opt-desc, .opt-meta, .opt-incl { margin-left: 34px; }
.opt-desc { color: var(--muted); font-size: 14px; }
.opt-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.opt-incl { font-size: 14px; color: var(--ink-2); display: grid; gap: 5px; padding-top: 4px; }
.opt-incl div { display: flex; gap: 8px; align-items: flex-start; }
.opt-incl .ico { width: 15px; height: 15px; color: var(--mjos-ink); margin-top: 3px; }

.addons { display: grid; gap: 8px; }
.addon { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px dashed #c9d1d6; border-radius: 16px; padding: 12px 14px; }
.addon.on { border: 1px solid var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.addon .t { flex: 1; min-width: 0; }
.addon .t b { display: block; font-size: 15px; }
.addon .t small { display: block; font-size: 13px; color: var(--muted); }
.addon .p { font: 700 14px var(--label); white-space: nowrap; }
.addon .tile-ico { width: 34px; height: 34px; border-radius: 10px; }
.addon .tile-ico .ico { width: 17px; height: 17px; }

.symptoms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.sym { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; gap: 10px; align-items: center; text-align: left; font-weight: 600; font-size: 14px; line-height: 1.3; }
.sym .ico { color: var(--mjos-ink); }
.sym.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; }
.input, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-input); padding: 14px; outline: none; font-size: 16px; transition: border-color .15s, box-shadow .15s; }
textarea { min-height: 96px; resize: vertical; }
.input:focus, textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(0, 169, 194, .18); }
.attach { width: 100%; display: flex; gap: 10px; align-items: center; border: 1px dashed #c9d1d6; border-radius: 14px; padding: 14px; background: var(--surface); text-align: left; color: var(--ink-2); font-size: 14px; }
.attach .ico { color: var(--mjos-ink); }

.loc-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.loc-chips::-webkit-scrollbar { display: none; }
.loc-list { display: grid; gap: 8px; }
.loc { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.loc.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.loc[disabled] { opacity: .55; cursor: not-allowed; background: transparent; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c4ccd2; flex: none; display: grid; place-items: center; }
.on > .radio { border-color: var(--ink); }
.on > .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.loc .t { flex: 1; min-width: 0; }
.loc .t b { display: block; font-size: 15px; }
.loc .t small { display: block; font: 600 12px var(--label); color: var(--muted); }
.loc .first { text-align: right; font: 600 12px var(--label); color: var(--muted); white-space: nowrap; }
.loc .first b { display: block; color: var(--ok); font-size: 13px; }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; width: 68px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 0; display: grid; gap: 2px; text-align: center; }
.day small { font: 600 12px var(--label); color: var(--muted); }
.day b { font-size: 20px; line-height: 1.1; }
.day i { font: 700 10px var(--label); font-style: normal; color: var(--ok); }
.day.full { opacity: .5; }
.day.full i { color: var(--muted); }
.day.on { background: var(--ink); color: #fff; border-color: var(--ink); opacity: 1; }
.day.on small, .day.on i { color: var(--isbre); }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-input); padding: 12px 0; font: 700 15px var(--label); font-variant-numeric: tabular-nums; }
.slot:hover:not([disabled]) { border-color: var(--ink); }
.slot.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.slot[disabled] { color: #b5bec4; background: transparent; text-decoration: line-through; cursor: not-allowed; border-style: dashed; }
.radios { display: grid; gap: 8px; }
.radio-row { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.radio-row.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.radio-row[disabled] { opacity: .55; cursor: not-allowed; }
.radio-row .t { flex: 1; min-width: 0; }
.radio-row .t b { display: block; font-size: 15px; }
.radio-row .t small { display: block; font-size: 13px; color: var(--muted); }
.radio-row .p { font: 700 14px var(--label); white-space: nowrap; }

.form { display: grid; gap: 14px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font: 600 12px var(--label); }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--ink); flex: none; }
.err { color: var(--err); font-size: 14px; font-weight: 600; }

.rows { display: grid; }
.row { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line-2); align-items: flex-start; }
.row:last-child { border-bottom: 0; }
.row > .ico { color: var(--muted); margin-top: 2px; }
.row .t { flex: 1; min-width: 0; font-size: 15px; }
.row .t small { display: block; font: 800 11px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }

/* Summary */
.summary { display: none; }
.sum { padding: 20px; display: grid; gap: 14px; }
.sum-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sum-h h3 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.sum-items { display: grid; gap: 10px; }
.sum-item { display: flex; gap: 10px; font-size: 14px; align-items: flex-start; }
.sum-item .n { flex: 1; }
.sum-item .p { font: 700 14px var(--label); white-space: nowrap; }
.sum-item .x { background: none; border: 0; padding: 0; color: var(--muted); }
.sum-item .x .ico { width: 16px; height: 16px; }
.sum-item .x:hover { color: var(--ink); }
.sum-meta { display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.sum-meta div { display: flex; gap: 8px; align-items: center; }
.sum-meta .ico { width: 16px; height: 16px; color: var(--muted); }
.sum-tot { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--line); padding-top: 14px; }
.sum-tot small { display: block; font: 600 12px var(--label); color: var(--muted); }
.sum-tot b { font: 800 26px var(--label); letter-spacing: -.02em; }
.sum-note { margin-top: 12px; }
.mbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(255, 255, 255, .97); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 12px; align-items: center; }
.mbar .tot { flex: 1; min-width: 0; }
.mbar .tot small { display: block; font: 600 12px var(--label); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbar .tot b { font: 800 19px var(--label); }
.mbar .btn { min-width: 128px; }

/* Done */
.done { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 28px 0 8px; }
.done-ico { width: 76px; height: 76px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; animation: grow .4s ease; }
.done-ico .ico { width: 36px; height: 36px; }
@keyframes grow { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.done h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.05; font-weight: 800; max-width: 620px; }
.ref small { display: block; font: 600 12px var(--label); color: var(--muted); }
.ref b { font: 800 22px var(--label); letter-spacing: .02em; }
.done-card { width: 100%; max-width: 560px; text-align: left; }
.done-actions { width: 100%; max-width: 560px; display: grid; gap: 10px; }

/* Product page */
.pdp { padding: 20px 0 80px; }
.pdp .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.crumbs { font: 600 12px var(--label); color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.pdp-img { border-radius: var(--r-panel); background: #fff center / cover no-repeat; border: 1px solid var(--line); aspect-ratio: 1 / 1; display: grid; place-items: center; overflow: hidden; }
.pdp-img.contain { background-size: contain; background-origin: content-box; padding: 32px; }
.pdp-info { display: grid; gap: 18px; align-content: start; min-width: 0; }
.pdp-info h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.05; font-weight: 800; }
.pdp-price { font: 800 30px var(--label); letter-spacing: -.02em; }
.pdp-price small { font: 600 13px var(--label); color: var(--muted); letter-spacing: 0; }
.bullets { display: grid; gap: 6px; font-size: 15px; }
.bullets div { display: flex; gap: 8px; align-items: flex-start; }
.bullets .ico { width: 16px; height: 16px; color: var(--mjos-ink); margin-top: 3px; }
.fit-box { padding: 16px; display: grid; gap: 12px; }
.fit-res { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; }
.fit-res.ok { background: var(--ok-soft); color: var(--ok); }
.fit-res.no { background: var(--warn-soft); color: var(--warn); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.qty button { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; }
.qty span { min-width: 30px; text-align: center; font: 700 16px var(--label); }

/* ---------- Min bil ---------- */
.mine { padding: 0 0 80px; }
.mine-hero { background: radial-gradient(800px 400px at 100% 0%, rgba(0, 169, 194, .22), transparent 60%), var(--fjord); color: #fff; padding: 28px 0 32px; }
.mine-hero .wrap { display: grid; gap: 18px; }
.mine-hero h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.02; font-weight: 800; }
.mine-hero .meta { color: #b9c6ce; font-size: 15px; }
.car-switch { display: flex; gap: 8px; flex-wrap: wrap; }
.car-switch .chip { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .14); color: #fff; }
.car-switch .chip.on { background: #fff; color: var(--ink); border-color: #fff; }
.hello { font: 600 13px var(--label); color: var(--isbre); display: flex; align-items: center; gap: 8px; }
.mine .wrap.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 20px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: grid; gap: 10px; align-content: start; }
.stat .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stat small { font: 600 12px var(--label); color: var(--muted); display: block; }
.stat b { font-size: 18px; line-height: 1.2; display: block; }
.stat .sub { font-size: 13px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--mjos); border-radius: 3px; }
.meter.warn i { background: var(--warn); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 16px 0; }
.panel-h h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.panel-b { padding: 14px 16px 16px; display: grid; gap: 12px; }
.upcoming { display: flex; gap: 14px; align-items: center; }
.date-tile { width: 60px; flex: none; border-radius: 14px; background: var(--ink); color: #fff; text-align: center; padding: 8px 0; }
.date-tile small { display: block; font: 700 11px var(--label); color: var(--isbre); text-transform: uppercase; }
.date-tile b { font-size: 24px; line-height: 1.1; }
.reco { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--sno); }
.reco .t { flex: 1; min-width: 0; font-size: 14px; }
.reco .t b { display: block; font-size: 15px; }
.reco .t small { display: block; color: var(--muted); font-size: 13px; }
.reco .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.tyre-panel { overflow: hidden; display: grid; }
.tyre-photo { min-height: 180px; background: 18% 30% / cover no-repeat; }
.tread { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tread div { background: var(--sno); border-radius: 12px; padding: 10px; text-align: center; }
.tread small { display: block; font: 700 11px var(--label); color: var(--muted); }
.tread b { font: 800 17px var(--label); }
.tread .w { color: var(--warn); }
.timeline { display: grid; }
.tl { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 18px; }
.tl:last-child { padding-bottom: 0; }
.tl::before { content: ''; position: absolute; left: 6px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl > i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--mjos); background: #fff; margin-top: 4px; }
.tl .t b { display: block; font-size: 15px; }
.tl .t small { display: block; font: 600 12px var(--label); color: var(--muted); }
.tl .t .line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.quick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.quick button { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; text-align: left; font-weight: 700; font-size: 14px; }
.quick button:hover { border-color: #c4ccd2; }
.login { max-width: 460px; margin: 40px auto; padding: 28px; display: grid; gap: 16px; text-align: center; justify-items: center; }
.login h1 { font-size: 30px; font-weight: 800; }
.login .btn { width: 100%; }
.bankid { background: #193e4f; color: #fff; }
.bankid:hover { background: #22526a; color: #fff; }

/* ---------- Breakpoints ---------- */
@media (min-width: 720px) {
  .intents { grid-template-columns: repeat(5, 1fr); }
  .products { grid-template-columns: repeat(4, 1fr); }
  .promos { grid-template-columns: 1fr 1fr; }
  .promo-winter.with-photo { grid-template-columns: 1fr 160px; align-items: end; }
  .promo-winter.with-photo .promo-photo { grid-row: 1 / span 4; grid-column: 2; min-height: 160px; align-self: stretch; }
  .eu-check { grid-template-columns: 1fr minmax(0, 420px); align-items: center; }
  .eu-check .eu-res { grid-column: 1 / -1; }
  .mycar-teaser { grid-template-columns: 1fr 1fr; align-items: center; padding: 40px; }
  .locs { grid-template-columns: repeat(5, 1fr); }
  .loc-card { flex-direction: column; align-items: flex-start; }
  .loc-card .btn { margin-left: 0; margin-top: 6px; }
  .usps { grid-template-columns: repeat(3, auto); justify-content: start; gap: 8px 22px; }
  .symptoms { grid-template-columns: repeat(4, 1fr); }
  .slots { grid-template-columns: repeat(4, 1fr); }
  .stepper .t { display: block; }
  .hdr-help span.t { display: inline; }
  .stat-grid { grid-template-columns: repeat(4, 1fr); }
  .quick { grid-template-columns: repeat(4, 1fr); }
  .tyre-panel { grid-template-columns: 220px 1fr; }
}
@media (min-width: 960px) {
  .nav { display: flex; }
  .hdr .hdr-book, .icon-btn.me { display: inline-flex; }
  .icon-btn.mob { display: none; }
  .hero .wrap { grid-template-columns: 1.05fr .95fr; padding-top: 72px; padding-bottom: 72px; align-items: center; gap: 48px; }
  .hero-photo { min-height: 420px; }
  .float-card { left: -24px; bottom: 40px; }
  .book .wrap { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; gap: 48px; }
  .summary { display: block; position: sticky; top: 88px; }
  .mbar.side { display: none; }
  .slots { grid-template-columns: repeat(6, 1fr); }
  .pdp .wrap { grid-template-columns: 1fr 1fr; gap: 56px; }
  .pdp .crumbs { grid-column: 1 / -1; }
  .footer { padding-bottom: 40px; }
  .footer .wrap { grid-template-columns: 1fr 1fr 1fr; }
  .book { padding-bottom: 72px; }
  .mine .wrap.grid { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
  .mine .col { display: grid; gap: 14px; min-width: 0; }
}

  const bg = (src) => 'style="background-image:url(\'' + src + '\')"';
  const plateChip = (p, lg) => '<span class="chip-plate' + (lg ? ' lg' : '') + '"><b>N</b><span>' + esc(p) + '</span></span>';

  const CATS = [
    { id: 'service', icon: 'wrench' }, { id: 'eu', icon: 'clipboard-check' }, { id: 'tyre', icon: 'circle-dot' },
    { id: 'issue', icon: 'triangle-alert' }, { id: 'other', icon: 'ellipsis' },
  ];
  const SYM_ICON = { alert: 'triangle-alert', sound: 'volume-2', disc: 'disc', steer: 'car-front', snow: 'snowflake', bolt: 'zap', key: 'key', dots: 'ellipsis' };
  const SVC_ICON = { brakes: 'disc', wipers: 'sparkles', battery: 'battery-charging', pre_pkk: 'clipboard-check', align: 'gauge', ac: 'snowflake' };

  // ---------- Router ----------
  const route = () => (location.hash.replace(/^#/, '') || '/').split('?')[0];
  const query = () => new URLSearchParams(location.hash.split('?')[1] || '');
  const go = (h) => { if (location.hash === '#' + h) render(); else location.hash = h; };
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

  // ---------- Chrome ----------
  const ribbon = () => '<div class="ribbon">' + t('proto_note') + '</div>';
  const langToggle = () => '<div class="lang" role="group" aria-label="Language"><button data-a="lang" data-v="no" aria-pressed="' + (S.lang === 'no') + '">NO</button><button data-a="lang" data-v="en" aria-pressed="' + (S.lang === 'en') + '">EN</button></div>';
  const logo = (white) => '<a class="logo" href="#/" aria-label="Mjøsbil"><img src="' + (white ? IMG.logoWhite : IMG.logoDark) + '" alt="Mjøsbil"></a>';

  function header() {
    return ribbon() + '<header class="hdr"><div class="wrap">' + logo() +
      '<nav class="nav"><a href="#/bestill/bil?k=service">' + t('nav_workshop') + '</a><a href="#/bestill/bil?k=tyre">' + t('nav_tyres') + '</a><a href="#/#shop">' + t('nav_shop') + '</a><a href="#/#locs">' + t('nav_locations') + '</a></nav>' +
      '<div class="hdr-right">' + langToggle() +
      '<a class="icon-btn me" href="#/min-bil">' + ic('user') + (S.user ? esc(S.user.name.split(' ')[0]) : t('nav_mine')) + '</a>' +
      '<a class="icon-btn mob" href="#/min-bil" aria-label="' + t('nav_mine') + '">' + ic('car') + '</a>' +
      '<button class="icon-btn" aria-label="Cart">' + ic('shopping-bag') + (S.cart ? '<span class="dot">' + S.cart + '</span>' : '') + '</button>' +
      '<a class="btn btn-ink btn-sm hdr-book" href="#/bestill/bil">' + t('nav_book') + '</a>' +
      '</div></div></header>';
  }
  function bookHeader() {
    return ribbon() + '<header class="hdr"><div class="wrap">' + logo() +
      '<button class="hdr-help link" data-a="toast" data-v="' + esc(t('help_toast', { phone: D.phone })) + '" style="color:var(--ink-2)">' + ic('phone') + '<span class="t">' + t('help') + '</span> ' + D.phone + '</button>' +
      langToggle() + '</div></header>';
  }
  function footer() {
    return '<footer class="footer"><div class="wrap"><div class="cols"><img src="' + IMG.logoWhite + '" alt="Mjøsbil"><span style="margin-top:10px">BilXtra verksted · Fagdekk · BilXtra butikk</span></div>' +
      '<div class="cols"><b style="color:#fff">' + t('nav_locations') + '</b><span>Gjøvik · Lillehammer · Dokka · Fåvang · Otta</span><span>' + D.phone + ' · post@mjosbil.no</span></div>' +

  }
  function plateInput(name, val) {
    return '<label class="plate"><span class="plate-eu"><i></i>N</span><span class="sr">Reg.nr</span>' +

  }
  const tryPlates = (action) => '<div class="try">' + t('hero_try') + ' ' + ['EL 12345', 'DN 54321', 'BR 11223'].map((p) => '<button data-a="' + action + '" data-v="' + p + '">' + plateChip(p) + '</button>').join('') + '</div>';

  // ---------- Availability (mock, deterministic) ----------
  const SLOT_TIMES = ['07:30', '08:00', '08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '12:30', '13:00', '14:00', '14:30'];
  const DAYS = (() => { const out = []; const d = new Date(); d.setHours(12, 0, 0, 0); while (out.length < 12) { d.setDate(d.getDate() + 1); if (d.getDay() % 6) out.push(new Date(d)); } return out; })();
  function slotsFor(loc, di) {
    if ((loc.seed * 31 + di * 17) % 11 === 0 && di < 3) return SLOT_TIMES.map(() => false);
    return SLOT_TIMES.map((_, i) => ((loc.seed + i * 7 + di * 5) % 10) > (di < 2 ? 6 : 3));
  }
  function firstFree(loc) { for (let d = 0; d < DAYS.length; d++) { const i = slotsFor(loc, d).indexOf(true); if (i >= 0) return { d, time: SLOT_TIMES[i] }; } return null; }
  const dayLabel = (i) => ((DAYS[0] - new Date()) < 2 * 864e5 && i === 0 ? t('tomorrow') : fmt(DAYS[i], { weekday: 'short', day: 'numeric', month: 'short' }));
  const firstFreeLabel = (loc) => { const f = firstFree(loc); return f ? dayLabel(f.d) + ' ' + f.time : '–'; };
  const whenText = (b) => { const day = b ? b.day : S.day; const slot = b ? b.slot : S.slot; return slot ? fmt(DAYS[day], { weekday: 'long', day: 'numeric', month: 'long' }) + ' ' + slot : ''; };

  // ---------- Home ----------
  function home() {
    const gj = locById('gjovik');
    let euRes = '';
    if (S.euCar) {
      const w = weeksTo(S.euCar.euDue);
      euRes = '<div class="eu-res ' + (w > 12 ? 'ok' : '') + '">' + ic(w > 12 ? 'circle-check' : 'clock') + '<span><b>' + esc(carName(S.euCar)) + '</b> · ' + t('eu_due_in', { date: fmt(S.euCar.euDue, { day: 'numeric', month: 'long', year: 'numeric' }) }) + '</span><button class="btn btn-ink btn-sm" data-a="eu-book">' + t('nav_book') + '</button></div>';
    }
    const g = D.garage.EL12345;
    return header() +
      '<section class="hero on-dark"><div class="wrap"><div>' +
      '<span class="kicker">' + t('hero_kicker') + '</span><h1>' + t('hero_title').replace('<br>', ' ') + '</h1><p class="sub">' + t('hero_sub') + '</p>' +
      '<form class="plate-row" data-form="hero">' + plateInput('plate', S.plate) + '<button class="btn btn-mjos" type="submit">' + t('hero_cta') + ic('arrow-right') + '</button></form>' +
      tryPlates('hero-try') +
      '<div class="usps"><span>' + ic('circle-check') + t('usp_price') + '</span><span>' + ic('zap') + t('usp_ev') + '</span><span>' + ic('shield-check') + t('usp_falck') + '</span></div>' +
      '</div><div class="hero-photo" ' + bg(IMG.hero) + '><div class="float-card"><span class="tile">' + ic('calendar-check') + '</span><span><small>' + t('hero_first', { loc: gj.name }) + '</small><b>' + firstFreeLabel(gj) + '</b></span></div></div></div></section>' +

      '<section class="section"><div class="wrap"><div class="sec-h"><h2>' + t('intent_title') + '</h2></div><div class="intents">' +
      CATS.map((c) => '<button class="intent" data-a="home-cat" data-v="' + c.id + '"><span class="tile-ico">' + ic(c.icon) + '</span><span><b>' + t('i_' + c.id) + '</b><small>' + t('i_' + c.id + '_sub') + '</small></span></button>').join('') +
      '</div></div></section>' +

      '<section class="section"><div class="wrap promos">' +
      '<div class="promo promo-winter with-photo"><span class="kicker">' + ic('snowflake') + t('season_kicker') + '</span><h3>' + t('season_title') + '</h3><p>' + t('season_text') + '</p><button class="btn btn-ink" data-a="home-cat" data-v="tyre">' + t('season_cta') + '</button><div class="promo-photo" ' + bg(IMG.hakka) + '></div></div>' +
      '<div class="promo promo-ev on-dark"><span class="kicker">' + ic('zap') + t('ev_kicker') + '</span><h3>' + t('ev_title') + '</h3><p>' + t('ev_text') + '</p><button class="btn btn-white" data-a="home-ev">' + t('ev_cta') + '</button></div>' +
      '</div></section>' +

      '<section class="section"><div class="wrap"><div class="eu-check"><div><h3>' + t('eu_check_title') + '</h3><p class="muted" style="margin-top:6px">' + t('eu_check_text') + '</p></div>' +
      '<form class="plate-row" data-form="eu">' + plateInput('euPlate', S.euPlate) + '<button class="btn btn-ink" type="submit">' + t('eu_check_cta') + '</button></form>' + euRes + '</div></div></section>' +

      '<section class="section"><div class="wrap"><div class="mycar-teaser on-dark"><div style="display:grid;gap:14px;justify-items:start"><span class="kicker">' + ic('car') + t('mt_kicker') + '</span><h3>' + t('mt_title') + '</h3><p>' + t('mt_text') + '</p><a class="btn btn-mjos" href="#/min-bil">' + t('mt_cta') + ic('arrow-right') + '</a></div>' +
      '<div class="mini-stack">' +
      '<div class="mini"><span class="tile-ico">' + ic('clipboard-check') + '</span><span><small>' + t('mt_eu') + ' · ' + plateChip('EL 12345') + '</small><b>' + fmt(D.cars.EL12345.euDue, { day: 'numeric', month: 'long', year: 'numeric' }) + '</b></span></div>' +
      '<div class="mini"><span class="tile-ico">' + ic('package') + '</span><span><small>' + t('mt_hotel') + '</small><b>' + L(g.hotel.stored) + ' · ' + esc(locById(g.hotel.loc).name) + '</b></span></div>' +
      '<div class="mini"><span class="tile-ico">' + ic('history') + '</span><span><small>' + t('mt_hist') + ' · ' + dShort(g.history[0].date) + '</small><b>' + esc(L(g.history[0].items)[0]) + '</b></span></div>' +
      '</div></div></div></section>' +

      '<section class="section" id="shop"><div class="wrap"><div class="sec-h"><div><h2>' + t('shop_title') + '</h2><p>' + t('shop_sub') + '</p></div><a class="link" href="#/produkt/hakka10">' + t('shop_all') + ic('arrow-right') + '</a></div><div class="products">' +
      Object.keys(D.products).map((id) => {
        const p = D.products[id];
        return '<a class="pcard" href="#/produkt/' + id + '"><div class="pimg' + (p.cover ? ' cover' : '') + '" ' + (p.img ? bg(p.img) : '') + '>' + (p.img ? '' : tyreArt(120)) + '</div><div class="pbody"><span class="brand">' + esc(p.brand) + '</span><span class="name">' + esc(p.name) + '</span><span class="spec">' + esc(L(p.spec)) + '</span><span class="price">' + kr(p.price) + ' <small>' + L(p.unit) + '</small></span>' + (p.fitting ? '<span class="tag tag-mjos">' + ic('wrench') + t('shop_fit') + '</span>' : '') + '</div></a>';
      }).join('') + '</div></div></section>' +

      '<section class="section" id="locs"><div class="wrap"><div class="sec-h"><div><h2>' + t('loc_title') + '</h2><p>' + t('loc_sub') + '</p></div></div>' +
      '<div class="loc-photo" ' + bg(IMG.facade) + ' style="margin-bottom:10px"></div><div class="locs">' +
      D.locations.map((l) => '<div class="loc-card"><span class="tile-ico">' + ic('map-pin') + '</span><div><b>' + esc(l.name) + '</b><div class="meta">' + t('first_free') + ': <b>' + firstFreeLabel(l) + '</b></div></div><a class="btn btn-ghost btn-sm" href="#/bestill/bil" data-a="pick-city" data-v="' + l.id + '">' + t('nav_book') + '</a></div>').join('') +
      '</div></div></section>' + footer();
  }

  function tyreArt(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="#1d2a33"/>' +
      Array.from({ length: 24 }, (_, i) => '<rect x="96" y="6" width="8" height="18" rx="2" fill="#0d1820" transform="rotate(' + (i * 15) + ' 100 100)"/>').join('') +
      '<circle cx="100" cy="100" r="56" fill="#c9d1d6"/><circle cx="100" cy="100" r="46" fill="#e8ecef"/>' +
      Array.from({ length: 5 }, (_, i) => '<rect x="95" y="58" width="10" height="34" rx="5" fill="#b5bfc5" transform="rotate(' + (i * 72) + ' 100 100)"/>').join('') +
      '<circle cx="100" cy="100" r="12" fill="#8d999f"/></svg>';
  }

  // ---------- Booking ----------
  const STEPS = ['bil', 'behov', 'tid', 'deg', 'bekreft'];
  const STEP_LBL = { bil: 'step_car', behov: 'step_need', tid: 'step_time', deg: 'step_you', bekreft: 'step_confirm' };
  const stepper = (cur) => { const ci = STEPS.indexOf(cur); return '<div class="stepper">' + STEPS.map((s, i) => '<div class="s ' + (i < ci ? 'past' : i === ci ? 'on' : '') + '"><div class="bar"></div><span class="t">' + t(STEP_LBL[s]) + '</span></div>').join('') + '</div>'; };

  function carCard(withChange) {
    const c = S.car;
    return '<div class="card car-card"><span class="car-thumb' + (c.fuel === 'ev' ? ' ev' : '') + '">' + ic(c.fuel === 'ev' ? 'zap' : 'car') + '</span><div class="t"><b>' + esc(carName(c)) + '</b><small>' + c.year + ' · ' + t('car_' + c.fuel) + ' · ' + c.wheel + '" ' + (S.lang === 'no' ? 'hjul' : 'wheels') + ' · ' + t('car_last_service') + ' ' + L(c.lastService) + '</small></div>' +
      '<div class="r">' + plateChip(c.plate) + (withChange ? '<button class="link" data-a="car-reset">' + t('car_not_you') + '</button>' : '') + '</div></div>';
  }

  function stepCar() {
    const found = S.car && !S.looking;
    if (found) {
      const c = S.car;
      return '<div class="step-h"><h1>' + t('car_found') + '</h1><p>' + t('car_sub') + '</p></div><div class="stack">' + carCard(true) +
        '<div class="car-facts"><div class="fact"><small>' + t('car_eu') + '</small><b>' + dShort(c.euDue) + '</b>' + (euSoon(c) ? '<div><span class="tag tag-warn" style="margin-top:6px">' + ic('clock') + t('car_eu_soon') + '</span></div>' : '') + '</div>' +
        '<div class="fact"><small>' + t('car_last_service') + '</small><b>' + L(c.lastService) + '</b></div><div class="fact"><small>' + t('car_wheels') + '</small><b>' + c.wheel + '"</b></div></div></div>';
    }
    return '<div class="step-h"><h1>' + t('car_title') + '</h1><p>' + t('car_sub') + '</p></div>' +
      '<form class="plate-row" data-form="car">' + plateInput('plate', S.plate) + '<button class="btn btn-ink" type="submit">' + t('car_lookup') + '</button></form>' +
      (S.looking ? '<div class="loading"></div>' : tryPlates('car-try'));
  }

  function optCard(id, recommended, single) {
    const s = svc({ id }); const on = has(id); const incl = L(s.incl);
    return '<button class="opt ' + (on ? 'on' : '') + '" data-a="toggle" data-v="' + id + '" data-single="' + (single ? s.cat : '') + '" aria-pressed="' + on + '">' +
      '<div class="opt-top"><span class="box">' + (on ? ic('check') : '') + '</span><span class="opt-title">' + esc(L(s.name)) + '</span><span class="opt-price">' + priceTxt(s) + (s.example ? '<small>' + t('example_price') + '</small>' : '') + (s.hotel ? '<small>' + t('tyre_season') + '</small>' : '') + '</span></div>' +
      '<div class="opt-desc">' + esc(L(s.desc)) + '</div>' +
      '<div class="opt-meta">' + (recommended ? '<span class="tag tag-mjos">' + ic('sparkles') + t('recommended') + '</span>' : '') + '<span class="tag">' + ic('timer') + dur(s.mins) + '</span>' +
      (s.mode === 'live' ? '<span class="tag tag-ok">' + ic('zap') + t('live') + '</span>' : '<span class="tag tag-warn">' + ic('clock') + t('request') + '</span>') + '</div>' +
      (on && incl ? '<div class="opt-incl">' + incl.map((x) => '<div>' + ic('check') + '<span>' + esc(x) + '</span></div>').join('') + '</div>' : '') +
      '</button>';
  }

  function addonList(mainIds) {
    const ids = [];
    mainIds.forEach((m) => (D.addons[m] || []).forEach((a) => { if (ids.indexOf(a) < 0 && mainIds.indexOf(a) < 0 && fitsCar(D.services[a])) ids.push(a); }));
    if (!ids.length) return '';
    return '<div class="sub-h">' + t('addons_title') + '</div><div class="addons">' + ids.slice(0, 3).map((id) => {
      const s = svc({ id }); const on = has(id);
      return '<button class="addon ' + (on ? 'on' : '') + '" data-a="toggle" data-v="' + id + '">' + (on ? '<span class="box">' + ic('check') + '</span>' : '<span class="tile-ico">' + ic(SVC_ICON[id] || 'plus') + '</span>') +
        '<span class="t"><b>' + esc(L(s.name)) + '</b><small>' + esc(L(s.desc)) + '</small></span><span class="p">' + (on ? t('added') : '+ ' + priceTxt(s)) + '</span></button>';
    }).join('') + '</div>';
  }

  function catBody(cat) {
    const c = S.car;
    const pick = (ids, rec, single) => ids.filter((id) => fitsCar(D.services[id])).map((id) => optCard(id, id === rec, single)).join('');
    const sel = (ids) => ids.filter(has);
    if (cat === 'service') {
      const ids = c.fuel === 'ev' ? ['ev_eco', 'ev_eco_brk', 'maker'] : ['eco20', 'maker', 'oil'];
      const rec = c.fuel === 'ev' ? 'ev_eco_brk' : (c.year < 2020 ? 'eco20' : 'maker');
      return '<div class="opts">' + pick(ids, rec, true) + '</div>' + addonList(sel(ids));
    }
    if (cat === 'eu') {
      const ids = ['pkk', 'pkk_heavy', 'recheck'];
      const due = fmt(c.euDue, { day: 'numeric', month: 'long', year: 'numeric' });
      return '<div class="note ' + (euSoon(c) ? 'warn' : '') + '">' + ic(euSoon(c) ? 'clock' : 'info') + '<span>' + t('eu_due_text', { date: due }) + (euSoon(c) ? ' ' + t('eu_due_soon_text', { weeks: weeksTo(c.euDue) }) : '') + '</span></div>' +
        '<div class="opts">' + pick(ids, c.weight > 3500 ? 'pkk_heavy' : 'pkk', true) + '</div>' + addonList(sel(ids));
    }
    if (cat === 'tyre') {
      const ids = ['hotel', 'swap'];
      return '<div class="note">' + ic('info') + '<span>' + t('tyre_size', { inch: c.wheel }) + '. ' + t('tyre_hotel_note') + '</span></div>' +
        '<div class="opts">' + pick(ids, 'hotel', true) + '</div>' + addonList(sel(ids)) +
        '<div class="card" style="padding:14px 16px;display:flex;gap:12px;align-items:center"><span class="tile-ico">' + ic('circle-dot') + '</span><b style="flex:1">' + t('tyre_new') + '</b><a class="btn btn-ghost btn-sm" href="#/produkt/hakka10">' + t('tyre_new_cta') + '</a></div>';
    }
    if (cat === 'issue') {
      const syms = D.symptoms.filter((s) => !s.fuel || s.fuel.indexOf(c.fuel) >= 0);
      const sugg = S.symptoms.map((id) => (D.symptoms.find((x) => x.id === id) || {}).suggest).filter(Boolean).filter((v, i, a) => a.indexOf(v) === i);
      return '<div class="sub-h" style="margin-top:0">' + t('issue_title') + '</div><p class="muted" style="margin-top:-8px">' + t('issue_sub') + '</p>' +
        '<div class="symptoms">' + syms.map((s) => '<button class="sym ' + (S.symptoms.indexOf(s.id) >= 0 ? 'on' : '') + '" data-a="sym" data-v="' + s.id + '">' + ic(SYM_ICON[s.icon] || 'ellipsis') + esc(L(s.name)) + '</button>').join('') + '</div>' +
        (S.symptoms.length ? '<div class="field"><label for="issue">' + t('issue_desc') + '</label><textarea id="issue" data-in="issueText" placeholder="' + esc(t('issue_desc_ph')) + '">' + esc(S.issueText) + '</textarea></div>' +
          '<button class="attach" data-a="attach">' + ic('camera') + '<span>' + t('issue_attach') + (S.attached ? ' · <b>' + S.attached + ' ' + t('issue_attached') + '</b>' : '') + '</span></button>' +
          '<div class="opts">' + optCard('diag', true, false) + '</div><div class="note">' + ic('phone') + '<span>' + t('issue_promise') + '</span></div>' +
          (sugg.length ? '<div class="sub-h">' + t('issue_suggest') + '</div><div class="opts">' + sugg.map((id) => optCard(id, false, false)).join('') + '</div>' : '') : '');
    }
    return '<div class="opts">' + pick(['ac', 'align', 'flush', 'rv'], c.weight > 3500 ? 'rv' : null, false) + '</div>';
  }

  function stepNeed() {
    const counts = {};
    S.items.forEach((i) => { const c = svc(i).cat; if (c && c !== 'addon' && c !== 'shop') counts[c] = (counts[c] || 0) + 1; });
    const nudge = euSoon(S.car) && S.cat !== 'eu' && !counts.eu ? '<button class="note warn" data-a="cat" data-v="eu" style="border:0;text-align:left;width:100%">' + ic('clock') + '<span>' + t('eu_due_text', { date: fmt(S.car.euDue, { day: 'numeric', month: 'long' }) }) + ' <b>' + t('eu_due_soon_text', { weeks: weeksTo(S.car.euDue) }) + '</b></span></button>' : '';
    return '<div class="step-h"><h1>' + t('need_title') + '</h1><p>' + t('need_sub') + '</p></div><div class="stack">' + carCard(true) + nudge +
      '<div class="cats" role="tablist">' + CATS.map((c) => '<button class="chip ' + (S.cat === c.id ? 'on' : '') + '" data-a="cat" data-v="' + c.id + '" role="tab" aria-selected="' + (S.cat === c.id) + '">' + t('i_' + c.id) + (counts[c.id] ? '<span class="n">' + counts[c.id] + '</span>' : '') + '</button>').join('') + '</div>' +
      catBody(S.cat) + '</div>';
  }

  const unavailableAt = (loc) => S.items.map((i) => i.id).filter((id) => loc.no.indexOf(id) >= 0);

  function stepTime() {
    const locs = D.locations.slice().sort((a, b) => a.km[S.city] - b.km[S.city]);
    if (!S.loc || unavailableAt(locById(S.loc)).length) { const f = locs.find((l) => !unavailableAt(l).length); S.loc = f ? f.id : null; S.slot = null; }
    const loc = locById(S.loc);
    const tot = totals();
    const canWait = tot.mins <= 90;
    if (!canWait && S.handover === 'wait') S.handover = 'drop';
    const slots = loc ? slotsFor(loc, S.day) : [];
    return '<div class="step-h"><h1>' + t('time_title') + '</h1><p>' + t('time_sub') + '</p></div><div class="stack">' +
      '<div><div class="lbl muted" style="font-size:12px;font-weight:600;margin-bottom:8px">' + t('near_pick') + '</div><div class="loc-chips">' +
      D.locations.map((l) => '<button class="chip ' + (S.city === l.id ? 'on' : '') + '" data-a="city" data-v="' + l.id + '">' + (l.id === 'gjovik' ? 'Gjøvik' : esc(l.area)) + '</button>').join('') + '</div></div>' +
      '<div class="loc-list">' + locs.map((l) => {
        const no = unavailableAt(l); const ff = firstFree(l);
        return '<button class="loc ' + (S.loc === l.id ? 'on' : '') + '" data-a="loc" data-v="' + l.id + '" ' + (no.length ? 'disabled' : '') + '><span class="radio"></span><span class="t"><b>' + esc(l.name) + '</b><small>' +
          (no.length ? t('cant_do', { service: esc(L(svc({ id: no[0] }).name).toLowerCase()) }) : esc(l.area) + ' · ' + l.km[S.city] + ' ' + t('km')) + '</small></span>' +
          (no.length || !ff ? '' : '<span class="first">' + t('first_free') + '<b>' + dayLabel(ff.d) + ' ' + ff.time + '</b></span>') + '</button>';
      }).join('') + '</div>' +
      (loc ? '<div class="sub-h">' + t('pick_day') + '</div><div class="days">' + DAYS.map((d, i) => {
        const free = slotsFor(loc, i).filter(Boolean).length;
        return '<button class="day ' + (S.day === i ? 'on' : '') + (free ? '' : ' full') + '" data-a="day" data-v="' + i + '"><small>' + fmt(d, { weekday: 'short' }) + '</small><b>' + d.getDate() + '</b><i>' + (free ? free + ' ' + (S.lang === 'no' ? 'ledige' : 'free') : (S.lang === 'no' ? 'fullt' : 'full')) + '</i></button>';
      }).join('') + '</div>' +
        '<div class="sub-h">' + t('pick_time') + '</div>' + (slots.some(Boolean) ? '<div class="slots">' + SLOT_TIMES.map((tm, i) => '<button class="slot ' + (S.slot === tm ? 'on' : '') + '" data-a="slot" data-v="' + tm + '" ' + (slots[i] ? '' : 'disabled') + '>' + tm + '</button>').join('') + '</div>' : '<p class="muted">' + t('no_slots') + '</p>') +
        (tot.request ? '<div class="note warn">' + ic('info') + '<span>' + t('req_note') + '</span></div>' : '') +
        '<div class="sub-h">' + t('handover') + '</div><div class="radios">' +
        '<button class="radio-row ' + (S.handover === 'drop' ? 'on' : '') + '" data-a="handover" data-v="drop"><span class="radio"></span><span class="t"><b>' + t('h_drop') + '</b><small>' + t('h_drop_sub') + '</small></span></button>' +
        '<button class="radio-row ' + (S.handover === 'wait' ? 'on' : '') + '" data-a="handover" data-v="wait" ' + (canWait ? '' : 'disabled') + '><span class="radio"></span><span class="t"><b>' + t('h_wait') + '</b><small>' + (canWait ? t('h_wait_sub') : t('h_wait_long')) + '</small></span></button>' +
        '</div>' : '') + '</div>';
  }

  function stepYou() {
    const c = S.contact;
    const f = (k, type, mode) => '<div class="field"><label for="f_' + k + '">' + t('f_' + k) + '</label><input class="input" id="f_' + k + '" type="' + type + '" data-in="contact.' + k + '" value="' + esc(c[k]) + '"' + (mode ? ' inputmode="' + mode + '"' : '') + '></div>';
    return '<div class="step-h"><h1>' + t('you_title') + '</h1><p>' + t('you_sub') + '</p></div><div class="form">' +
      '<button class="btn btn-vipps btn-block" data-a="vipps">' + t('vipps') + '</button><div class="divider">' + t('or_manual') + '</div>' +
      f('name', 'text') + f('phone', 'tel', 'tel') + f('email', 'email', 'email') + f('km', 'text', 'numeric') +

  // ---------- Render ----------
  const app = document.getElementById('app');
  let toastTimer;
  function toast(msg, icon) {
    clearTimeout(toastTimer);
    let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }

  function render() {
    document.documentElement.lang = S.lang === 'no' ? 'nb' : 'en';
    const parts = route().split('/').filter(Boolean);
    const k = query().get('k'); if (k) S.cat = k;
    let html;
    if (parts[0] === 'bestill') html = booking(parts[1] || 'bil');
    else if (parts[0] === 'produkt') html = pdp(parts[1]);
    else if (parts[0] === 'min-bil') html = mine();
    else html = home();

  // ---------- Actions ----------
  function doLookup(plate, then) {
    S.plate = prettyPlate(plate); const c = lookup(plate); if (!c) return;
    if (!S.car || S.car.key !== c.key) S.items = S.items.filter((i) => i.custom);
    S.car = c; S.looking = true; render();
    setTimeout(() => { S.looking = false; if (then) then(); else render(); }, 650);
  }
  function afterCar() {
    if (S.after) { const a = S.after; S.after = null; go(a); return; }
    go('/bestill/behov');
  }
  function toggle(id, single) {
    const idx = S.items.findIndex((i) => i.id === id);
    if (idx >= 0) { S.items.splice(idx, 1); toast(t('toast_removed'), 'x'); return; }
    if (single) S.items = S.items.filter((i) => svc(i).cat !== single);
    S.items.push({ id }); toast(t('toast_added'));
  }
  function startFor(carKey, cat) {
    S.car = Object.assign({ key: carKey }, D.cars[carKey]); S.plate = S.car.plate; S.cat = cat;
    if (S.user && !S.contact.name) Object.assign(S.contact, { name: S.user.name, phone: '912 34 567', email: 'kari.nordmann@example.no' });
    go('/bestill/behov');
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a; const v = el.dataset.v;
    if (el.tagName === 'A' && a !== 'pick-city') e.preventDefault();
    switch (a) {
      case 'lang': S.lang = v; store.set('lang', v); render(); break;
      case 'nav': go(v); break;
      case 'hero-try': doLookup(v, () => go('/bestill/behov')); break;
      case 'home-cat': S.cat = v; go(S.car ? '/bestill/behov' : '/bestill/bil'); break;
      case 'home-ev': S.cat = 'service'; doLookup('EL 12345', afterCar); break;
      case 'eu-book': S.car = S.euCar; S.plate = S.euCar.plate; S.items = S.items.filter((i) => svc(i).cat !== 'eu'); S.items.push({ id: S.euCar.weight > 3500 ? 'pkk_heavy' : 'pkk' }); S.cat = 'eu'; go('/bestill/behov'); break;
      case 'pick-city': S.city = v; S.loc = v; break;
      case 'car-try': doLookup(v, afterCar); break;
      case 'car-reset': S.car = null; S.plate = ''; S.items = S.items.filter((i) => i.custom); go('/bestill/bil'); break;
      case 'to-need': afterCar(); break;
      case 'cat': S.cat = v; render(); break;
      case 'toggle': toggle(v, el.dataset.single); render(); break;
      case 'sym': {
        const i = S.symptoms.indexOf(v); if (i >= 0) S.symptoms.splice(i, 1); else S.symptoms.push(v);
        if (S.symptoms.length && !has('diag')) { S.items.push({ id: 'diag' }); toast(t('toast_added')); }
        if (!S.symptoms.length) S.items = S.items.filter((x) => x.id !== 'diag');
        render(); break;
      }
      case 'attach': S.attached += 1; render(); break;
      case 'remove': { const it = S.items[+v]; S.items.splice(+v, 1); if (it && it.id === 'diag') S.symptoms = []; toast(t('toast_removed'), 'x'); render(); break; }
      case 'to-time': if (S.items.length) go('/bestill/tid'); break;
      case 'city': S.city = v; S.loc = null; S.slot = null; render(); break;
      case 'loc': S.loc = v; S.slot = null; render(); break;
      case 'day': S.day = +v; S.slot = null; render(); break;
      case 'slot': S.slot = v; render(); break;
      case 'handover': S.handover = v; render(); break;
      case 'to-you': if (S.slot) { if (S.user && !S.contact.name) Object.assign(S.contact, { name: S.user.name, phone: '912 34 567', email: 'kari.nordmann@example.no' }); go('/bestill/deg'); } break;
      case 'vipps': Object.assign(S.contact, { name: 'Kari Nordmann', phone: '912 34 567', email: 'kari.nordmann@example.no' }); S.err = ''; render(); break;
      case 'to-confirm': if (validContact()) { S.err = ''; go('/bestill/bekreft'); } else { S.err = t('f_required'); render(); } break;
      case 'submit': {
        const tot = totals();
        S.booking = { ref: 'MB-' + (48000 + Math.floor(Math.random() * 1900)), car: S.car, items: S.items.slice(), symptoms: S.symptoms.slice(), loc: S.loc, day: S.day, slot: S.slot, handover: S.handover, contact: Object.assign({}, S.contact), tot, request: tot.request };
        if (!S.user) S.user = { name: S.contact.name };
        if (D.garage[S.car.key]) S.mineCar = S.car.key;
        go('/bestill/ferdig'); break;
      }
      case 'done-mine': go('/min-bil'); break;
      case 'restart': Object.assign(S, { items: [], symptoms: [], issueText: '', attached: 0, slot: null, day: 0 }); go('/'); break;
      case 'toast': toast(v, 'info'); break;
      case 'login': S.user = { name: D.garage.owner }; render(); break;
      case 'logout': S.user = null; render(); break;
      case 'mine-car': S.mineCar = v; render(); break;
      case 'mine-book': startFor(S.mineCar, v); break;
      case 'mine-add': { startFor(S.mineCar, 'service'); if (!has(v)) S.items.push({ id: v }); toast(t('toast_added')); render(); break; }
      case 'pdp-try': S.pdp.car = lookup(v); if (!S.car) S.car = S.pdp.car; render(); break;
      case 'qty': S.pdp.qty = Math.max(1, Math.min(8, S.pdp.qty + +v)); render(); break;
      case 'pdp-del': S.pdp.delivery = v; render(); break;
      case 'pdp-cart': S.cart += S.pdp.qty; toast(t('pdp_added'), 'shopping-bag'); render(); break;
      case 'pdp-fit': {
        const p = D.products[v];
        if (S.pdp.car && (!S.car || S.car.key !== S.pdp.car.key)) { S.car = S.pdp.car; S.items = []; }
        S.items = S.items.filter((i) => !i.custom && svc(i).cat !== 'tyre');
        S.items.unshift({ id: 'shop_' + v, custom: true, cat: 'shop', name: { no: S.pdp.qty + ' × ' + p.brand + ' ' + p.name, en: S.pdp.qty + ' × ' + p.brand + ' ' + p.name }, price: p.price * S.pdp.qty, mins: 0, mode: 'live', example: true });
        S.items.push({ id: S.pdp.hotel ? 'hotel' : 'swap' });
        if (S.car) go('/bestill/tid'); else { S.after = '/bestill/tid'; go('/bestill/bil'); }
        break;
      }
    }
  });

  document.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-form]'); if (!f) return;
    e.preventDefault();
    const kind = f.dataset.form;
    if (kind === 'hero') doLookup(S.plate, () => go('/bestill/behov'));
    else if (kind === 'car') doLookup(S.plate, afterCar);
    else if (kind === 'eu') { S.euCar = lookup(S.euPlate); render(); }
    else if (kind === 'pdp') { S.pdp.car = lookup(S.pdp.plate); if (S.pdp.car && !S.car) S.car = S.pdp.car; render(); }
  });

  document.addEventListener('input', (e) => {
    const k = e.target.dataset && e.target.dataset.in; if (!k) return;
    const val = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (k.indexOf('contact.') === 0) S.contact[k.slice(8)] = val;
    else if (k === 'pdp.hotel') { S.pdp.hotel = val; render(); }
    else if (k === 'pdpPlate') S.pdp.plate = val;
    else S[k] = val;
  });

  render();
})();
</script>
</body>
</html>
